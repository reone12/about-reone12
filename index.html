<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="reone12의 간단한 자기소개 페이지" />
    <title>reone12 | 소개</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #2e1065;
        color: #e2e8f0;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top right, #a855f7, transparent 42%), #2e1065;
      }

      main {
        width: min(680px, calc(100% - 2rem));
        padding: 3rem;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #93c5fd;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 4.5rem); }
      p { font-size: 1.1rem; line-height: 1.8; }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: #2563eb;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover, a:focus-visible { background: #3b82f6; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Hello, GitHub!</p>
      <h1>안녕하세요, reone12입니다.</h1>
      <p>
        만들고 배우는 과정을 즐깁니다. 이 페이지는 GitHub와 풀 리퀘스트로
        관리하는 작은 자기소개 웹페이지입니다.
      </p>
      <a href="https://github.com/reone12" target="_blank" rel="noreferrer">GitHub 프로필 방문하기</a>
    </main>
  </body>
</html>
